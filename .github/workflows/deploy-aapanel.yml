name: Deploy (aaPanel)

# Continuous deployment of the demo/UAT stack to the aaPanel Linux server, via PREBUILT IMAGES.
#
# 1. build : build the API + web images and push them to GHCR (ghcr.io/<owner>/auditx-api|auditx-web).
# 2. deploy: copy docker-compose.images.yml to the server and run `docker compose pull && up -d` — no build on the box.
#
# The server needs no source tree — only a directory with a local .env (and docker login to GHCR if the packages are
# private). Full setup (server prep + the GitHub secrets below) is in docs/AAPANEL_DEPLOYMENT.md (§7).
#
# Triggers: automatically after the CI workflow succeeds on `main`, or manually from the Actions tab.
#
# Required on the `aapanel-demo` GitHub Environment:
#   secrets:  AAPANEL_SSH_HOST, AAPANEL_SSH_USER, AAPANEL_SSH_KEY   (AAPANEL_SSH_PORT optional, default 22)
#   vars:     AAPANEL_DEPLOY_PATH  (optional, default /opt/auditx)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      imageTag:
        description: "Image tag to deploy (blank = the sha built by this run)"
        required: false
        default: ""

concurrency:
  group: deploy-aapanel
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    # On the automatic trigger, only proceed when CI actually passed. Manual runs are always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      matrix:
        include:
          - image: auditx-api
            dockerfile: docker/Api.Dockerfile
          - image: auditx-web
            dockerfile: docker/Web.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit CI validated (workflow_run) or the current ref (dispatch).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute owner + tag
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to aaPanel server
    needs: build
    runs-on: ubuntu-latest
    environment: aapanel-demo
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          t="${{ github.event.inputs.imageTag }}"
          [ -n "$t" ] || t="${{ needs.build.outputs.tag }}"
          echo "value=${t}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH (pull prebuilt images)
        env:
          SSH_HOST: ${{ secrets.AAPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.AAPANEL_SSH_USER }}
          SSH_PORT: ${{ secrets.AAPANEL_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.AAPANEL_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.AAPANEL_DEPLOY_PATH || '/opt/auditx' }}
          GHCR_OWNER: ${{ needs.build.outputs.owner }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::error::Missing SSH secrets. Set AAPANEL_SSH_HOST / AAPANEL_SSH_USER / AAPANEL_SSH_KEY on the aapanel-demo environment."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          # ssh takes -p for the port, scp takes -P — keep the shared options separate from the port flag.
          OPTS=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes)
          echo "Deploying ghcr.io/${GHCR_OWNER}/auditx-{api,web}:${IMAGE_TAG} to ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}"
          ssh "${OPTS[@]}" -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}'"
          scp "${OPTS[@]}" -P "${SSH_PORT}" docker-compose.images.yml "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/docker-compose.images.yml"
          ssh "${OPTS[@]}" -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '${DEPLOY_PATH}' '${GHCR_OWNER}' '${IMAGE_TAG}'" < deploy/aapanel-deploy-images.sh

      - name: Scrub key
        if: always()
        run: rm -f ~/.ssh/deploy_key
