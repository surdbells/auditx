name: auditx

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: auditx-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Auditx_Local_Dev_123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: auditx-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: auditx-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Api.Dockerfile
    container_name: auditx-api
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # This is a LOCAL DEMO stack: it runs the seeded Development identity provider (admin/manager/auditor/auditee,
      # password Passw0rd!). The production safety guard refuses to boot the dev provider outside Development, so this
      # stack MUST run as Development. For a production deployment see docs/DEPLOYMENT_RUNBOOK.md.
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__MigrateOnStartup: "true"
      # Seed the rich, interconnected demo dataset (every module populated) for this local demo stack. Idempotent
      # and gated: never enable in a production deployment. Log in as admin / manager / auditor / auditee (Passw0rd!).
      Database__SeedDemoData: "true"
      # Public web base URL used to build deep links in notification emails (e.g. the evidence-request upload link).
      Notifications__WebBaseUrl: "http://localhost:4288"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=auditx;User Id=sa;Password=Auditx_Local_Dev_123;TrustServerCertificate=True;Encrypt=False"
      Redis__ConnectionString: "redis:6379"
      Identity__Provider: "Development"
      Jwt__SigningKey: "auditx-compose-dev-signing-key-min-32-bytes-0123456789"
      Cors__Origins__0: "http://localhost:4200"
    volumes:
      - evidence-data:/app/evidence-store
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: docker/Web.Dockerfile
    container_name: auditx-web
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  sqlserver-data:
  redis-data:
  rabbitmq-data:
  evidence-data:
