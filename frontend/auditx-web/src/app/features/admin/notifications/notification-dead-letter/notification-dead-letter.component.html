<div class="dead-letter__toolbar">
  <button matButton type="button" (click)="fetch()">
    <mat-icon>refresh</mat-icon>
    Refresh
  </button>
</div>

@switch (state()) {
  @case ('loading') {
    <app-loading message="Loading dead-letter queue…" />
  }
  @case ('error') {
    <app-error-state
      message="We couldn't load the dead-letter queue."
      (retry)="fetch()"
    />
  }
  @case ('ready') {
    @if (isEmpty()) {
      <app-empty-state
        icon="mark_email_read"
        title="Dead-letter queue is empty"
        message="No notification dispatches have been dead-lettered."
      />
    } @else {
      <mat-card appearance="outlined" class="dead-letter__table-card">
        <div class="dead-letter__table-wrapper">
          <table
            mat-table
            [dataSource]="dispatches()"
            class="dead-letter__table"
          >
            <ng-container matColumnDef="eventType">
              <th mat-header-cell *matHeaderCellDef>Event</th>
              <td mat-cell *matCellDef="let d">
                <span class="dead-letter__event">{{ d.eventType }}</span>
                <span class="dead-letter__template">{{ d.templateKey }}</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="recipient">
              <th mat-header-cell *matHeaderCellDef>Recipient</th>
              <td mat-cell *matCellDef="let d">{{ d.recipientAddress }}</td>
            </ng-container>

            <ng-container matColumnDef="channel">
              <th mat-header-cell *matHeaderCellDef>Channel</th>
              <td mat-cell *matCellDef="let d" class="dead-letter__channel">
                {{ d.channel }}
              </td>
            </ng-container>

            <ng-container matColumnDef="attempts">
              <th mat-header-cell *matHeaderCellDef>Attempts</th>
              <td mat-cell *matCellDef="let d">{{ d.attempts }}</td>
            </ng-container>

            <ng-container matColumnDef="lastError">
              <th mat-header-cell *matHeaderCellDef>Last error</th>
              <td mat-cell *matCellDef="let d" class="dead-letter__error">
                {{ d.lastError ?? '—' }}
              </td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef aria-label="Actions"></th>
              <td mat-cell *matCellDef="let d">
                @if (canRetry()) {
                  <button matButton type="button" (click)="retry(d)">
                    <mat-icon>replay</mat-icon>
                    Retry
                  </button>
                }
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
        </div>
      </mat-card>
    }
  }
}
