<app-page-header
  [title]="'config.list.title' | t"
  [subtitle]="'config.list.subtitle' | t"
/>

<app-page-guide [guide]="guide" />

<div class="config-list__grid">
  @for (d of domains; track d.domain) {
    <mat-card
      appearance="outlined"
      class="config-list__card"
      [routerLink]="['/admin/configuration', d.domain]"
    >
      <mat-card-header>
        <app-icon mat-card-avatar aria-hidden="true" [name]="d.icon" />
        <mat-card-title>{{ d.title }}</mat-card-title>
        <mat-card-subtitle data-guide="domain-code">{{ d.domain }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p class="config-list__desc">{{ d.description }}</p>
      </mat-card-content>
    </mat-card>
  }
</div>
