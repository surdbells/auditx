<app-page-guide [guide]="guide" />

@switch (state()) {
  @case ('loading') {
    <app-loading [message]="'administration.health.loading' | t" />
  }
  @case ('error') {
    <app-error-state
      [message]="'administration.health.loadError' | t"
      (retry)="fetch()"
    />
  }
  @case ('ready') {
    <div class="health__status">
      <span class="status-badge" [attr.data-status]="health()?.status">
        {{ health()?.status }}
      </span>
      <span class="muted">
        {{ 'administration.health.generated' | t: { date: (health()?.generatedAt | date: 'medium') } }}
      </span>
    </div>

    <div class="health__grid">
      @for (m of metrics(); track m.label) {
        <mat-card appearance="outlined" class="health__card">
          <app-icon class="health__icon" aria-hidden="true" [name]="m.icon" />
          <div class="health__value">{{ m.value }}</div>
          <div class="health__label">{{ m.label }}</div>
        </mat-card>
      }
    </div>
  }
}
