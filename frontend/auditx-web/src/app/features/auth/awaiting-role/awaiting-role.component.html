<div class="awaiting">
  <mat-card class="awaiting__card" appearance="outlined">
    <mat-card-content class="awaiting__content">
      <app-icon class="awaiting__icon" aria-hidden="true" name="hourglass_top" />
      <h1 class="awaiting__title">{{ 'account.awaiting.title' | t }}</h1>
      <p class="awaiting__lead">
        {{ 'account.awaiting.lead' | t: { name: session()?.firstName ? ', ' + session()?.firstName : '' } }}
      </p>
      <p class="awaiting__detail">
        {{ 'account.awaiting.detail' | t }}
      </p>

      <div class="awaiting__actions">
        <button matButton="filled" type="button" (click)="refresh()">
          <app-icon name="refresh" />
          {{ 'account.awaiting.checkAgain' | t }}
        </button>
        <button matButton type="button" (click)="logout()">
          <app-icon name="logout" />
          {{ 'account.awaiting.signOut' | t }}
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
