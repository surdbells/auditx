<app-page-header
  [title]="'account.prefs.title' | t"
  [subtitle]="'account.prefs.subtitle' | t"
/>

@switch (state()) {
  @case ('loading') {
    <app-loading [message]="'account.prefs.loading' | t" />
  }
  @case ('error') {
    <app-error-state
      [message]="'account.prefs.error' | t"
      (retry)="fetch()"
    />
  }
  @case ('ready') {
    <mat-card appearance="outlined" class="prefs__card">
      <div class="prefs__row">
        <div class="prefs__text">
          <span class="prefs__label">{{ 'account.prefs.smsLabel' | t }}</span>
          <span class="prefs__hint">
            {{ 'account.prefs.smsHint' | t }}
          </span>
        </div>
        <mat-slide-toggle
          [checked]="smsNonCritical()"
          (change)="smsNonCritical.set($event.checked)"
          [attr.aria-label]="'account.prefs.smsLabel' | t"
        />
      </div>

      <div class="prefs__row">
        <div class="prefs__text">
          <span class="prefs__label">{{ 'account.prefs.digestsLabel' | t }}</span>
          <span class="prefs__hint">
            {{ 'account.prefs.digestsHint' | t }}
          </span>
        </div>
        <mat-slide-toggle
          [checked]="digests()"
          (change)="digests.set($event.checked)"
          [attr.aria-label]="'account.prefs.digestsLabel' | t"
        />
      </div>

      <div class="prefs__actions">
        <button
          matButton="filled"
          type="button"
          (click)="save()"
          [disabled]="saving()"
        >
          {{ (saving() ? 'account.actions.saving' : 'account.actions.save') | t }}
        </button>
      </div>
    </mat-card>
  }
}
