<app-page-header
  [title]="'ac.dashboard.title' | t"
  [subtitle]="'ac.dashboard.subtitle' | t"
/>

@switch (state()) {
  @case ('loading') {
    <app-loading [message]="'ac.dashboard.loading' | t" />
  }
  @case ('error') {
    <app-error-state
      [message]="'ac.dashboard.error' | t"
      (retry)="fetch()"
    />
  }
  @case ('ready') {
    @if (dashboard(); as d) {
      <app-ac-analytics-sections
        [totalPlans]="d.totalPlans"
        [planItemsTotal]="d.planItemsTotal"
        [planItemsCompleted]="d.planItemsCompleted"
        [planCompletionPercent]="d.planCompletionPercent"
        [openExceptionTotal]="d.openExceptionTotal"
        [averageClosureDays]="d.averageClosureDays"
        [exceptionsBySeverity]="d.exceptionsBySeverity"
        [materialFindings]="d.materialFindings"
        [sanctionsTotalCases]="d.sanctionsTotalCases"
        [sanctionsGridAdherencePercent]="d.sanctionsGridAdherencePercent"
        [sanctionsAppealRatePercent]="d.sanctionsAppealRatePercent"
        [sanctionsByBusinessUnit]="d.sanctionsByBusinessUnit"
        [recurrenceClusters]="d.recurrenceClusters"
      />
    }
  }
}
